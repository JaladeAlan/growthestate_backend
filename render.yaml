services:
  # ── Web Service (Laravel App) ─────────────────────────────
  - type: web
    name: sproutvest-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false

  # ── Queue Worker (separate service) ───────────────────────
  - type: worker
    name: sproutvest-queue
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    startCommand: >
      php artisan queue:work redis
      --sleep=3
      --tries=3
      --timeout=120
      --memory=128
      --max-jobs=100
    envVars:
      - key: APP_ENV
        value: production