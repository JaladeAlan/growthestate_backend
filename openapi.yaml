                      $ref: '#/components/schemas/Notification'

  /notifications/read:
    post:
      tags: [Notifications]
      summary: Mark all notifications as read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All notifications marked as read

  /notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark a single notification as read
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/notificationId'
      responses:
        "200":
          description: Notification marked as read
        "404":
          description: Not found

  ################################################################
  # REFERRALS
  ################################################################

  /referrals/dashboard:
    get:
      tags: [Referrals]
      summary: Referral dashboard — code, link, stats, and reward history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Referral dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      referral_code:
                        type: string
                      referral_link:
                        type: string
                        format: uri
                      total_referrals:
                        type: integer
                      completed_referrals:
                        type: integer
                      pending_referrals:
                        type: integer
                      total_rewards_kobo:
                        type: integer
                      unclaimed_rewards_kobo:
                        type: integer
                      referrals:
                        type: array
                        items:
                          $ref: '#/components/schemas/Referral'
                      rewards:
                        type: array
                        items:
                          $ref: '#/components/schemas/ReferralReward'

  /referrals/validate:
    post:
      tags: [Referrals]
      summary: Validate a referral code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: Code valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      code:
                        type: string
                      referrer_name:
                        type: string
        "404":
          description: Invalid referral code

  /referrals/rewards:
    get:
      tags: [Referrals]
      summary: Get unclaimed referral rewards
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Available rewards

  /referrals/rewards/{id}/claim:
    post:
      tags: [Referrals]
      summary: Claim a referral reward
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reward claimed
        "400":
          description: Already claimed
        "404":
          description: Reward not found

  ################################################################
  # SUPPORT
  ################################################################

  /support/chat:
    post:
      tags: [Support]
      summary: AI-powered support chat
      description: >
        Rate limited to 20 messages per 10 minutes.
        Automatically escalates financial/security keywords to ticket creation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                        maxLength: 2000
      responses:
        "200":
          description: AI reply
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      reply:
                        type: string
                      escalate:
                        type: boolean
                      from_faq:
                        type: boolean
        "429":
          description: Rate limit exceeded
        "503":
          description: AI service unavailable

  /support/tickets:
    get:
      tags: [Support]
      summary: List own support tickets (paginated)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ticket list
    post:
      tags: [Support]
      summary: Create a new support ticket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [subject, category, message]
              properties:
                subject:
                  type: string
                  maxLength: 150
                category:
                  type: string
                  enum: [account, payment, kyc, investment, withdrawal, other]
                message:
                  type: string
                  maxLength: 3000
                priority:
                  type: string
                  enum: [low, normal, high]
                  nullable: true
                attachment:
                  type: string
                  format: binary
                  nullable: true
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SupportTicket'

  /support/tickets/guest:
    post:
      tags: [Support]
      summary: Submit a support ticket as a guest (rate limited 5/10 min per IP)
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, email, subject, category, message]
              properties:
                name:
                  type: string
                  maxLength: 100
                email:
                  type: string
                  format: email
                subject:
                  type: string
                  maxLength: 150
                category:
                  type: string
                  enum: [account, payment, kyc, investment, withdrawal, other]
                message:
                  type: string
                  maxLength: 3000
                attachment:
                  type: string
                  format: binary
                  nullable: true
      responses:
        "201":
          description: Guest ticket submitted
        "429":
          description: Rate limit exceeded

  /support/tickets/{ticket}:
    get:
      tags: [Support]
      summary: Get a single support ticket with messages
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ticketParam'
      responses:
        "200":
          description: Ticket detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SupportTicket'
        "404":
          description: Ticket not found

  /support/tickets/{ticket}/reply:
    post:
      tags: [Support]
      summary: Reply to a support ticket
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ticketParam'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  maxLength: 3000
                attachment:
                  type: string
                  format: binary
                  nullable: true
      responses:
        "201":
          description: Reply sent
        "422":
          description: Ticket already resolved

  /support/tickets/{ticket}/close:
    patch:
      tags: [Support]
      summary: Close / resolve a support ticket
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ticketParam'
      responses:
        "200":
          description: Ticket closed

  /support/faqs:
    get:
      tags: [Support]
      summary: Get FAQs grouped by category (cached 1 hour)
      security: []
      responses:
        "200":
          description: FAQs grouped by category

  ################################################################
  # LIVE CHAT (user side)
  ################################################################

  /support/live-chat/request:
    post:
      tags: [Live Chat]
      summary: Request a live agent (creates or upgrades a ticket, joins the queue)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveChatRequestBody'
      responses:
        "200":
          description: Added to queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  ticket_id: { type: integer }
                  reference: { type: string }
                  queue_pos: { type: integer }
                  message: { type: string }

  /support/live-chat/{ticket}/message:
    post:
      tags: [Live Chat]
      summary: Send a message on an active live chat ticket
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ticketParam'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LiveChatMessageRequest'
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/SupportMessage'
        "404":
          description: Ticket not found or not owned by this user

  /support/live-chat/{ticket}/typing:
    post:
      tags: [Live Chat]
      summary: Broadcast a typing indicator to the agent
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ticketParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveChatTypingRequest'
      responses:
        "200":
          description: Typing event broadcast
        "404":
          description: Ticket not found or not owned by this user

  ################################################################
  # MARKETPLACE
  ################################################################

  /marketplace:
    get:
      tags: [Marketplace]
      summary: Browse active marketplace listings
      security:
        - bearerAuth: []
      parameters:
        - name: land_id
          in: query
          schema: { type: integer }
        - name: min_price
          in: query
          schema: { type: integer }
        - name: max_price
          in: query
          schema: { type: integer }
        - name: sort
          in: query
          schema:
            type: string
            enum: [price_asc, price_desc, newest, units_desc]
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: Paginated active listings
    post:
      tags: [Marketplace]
      summary: Create a listing to sell owned units on the marketplace
      description: >
        Fails with a validation error if units_for_sale exceeds the
        seller's unlisted units for that land (owned units minus units
        already in other active listings).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketplaceListingCreateRequest'
      responses:
        "201":
          description: Listing created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    $ref: '#/components/schemas/MarketplaceListing'
        "422":
          description: Insufficient unlisted units

  /marketplace/my-listings:
    get:
      tags: [Marketplace]
      summary: List the current user's own marketplace listings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Paginated own listings

  /marketplace/my-offers:
    get:
      tags: [Marketplace]
      summary: List offers the current user has made as a buyer
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Paginated own offers

  /marketplace/my-transactions:
    get:
      tags: [Marketplace]
      summary: List completed marketplace trades involving the current user (either side)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Paginated own transactions

  /marketplace/{listing}:
    get:
      tags: [Marketplace]
      summary: View a single listing with pending offers
      security:
        - bearerAuth: []
      parameters:
        - name: listing
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Listing detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/MarketplaceListing'
    patch:
      tags: [Marketplace]
      summary: Edit an active listing (seller only)
      security:
        - bearerAuth: []
      parameters:
        - name: listing
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketplaceListingUpdateRequest'
      responses:
        "200":
          description: Listing updated
        "403":
          description: Not the listing's seller
        "422":
          description: Listing is not active
    delete:
      tags: [Marketplace]
      summary: Cancel an active listing (seller only) — rejects any pending offers
      security:
        - bearerAuth: []
      parameters:
        - name: listing
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Listing cancelled
        "403":
          description: Not the listing's seller
        "422":
          description: Listing is not active

  /marketplace/{listing}/offers:
    post:
      tags: [Marketplace]
      summary: Make an offer on a listing (buyer)
      description: >
        Rejected if the buyer already has a pending offer on this listing
        (must withdraw it first), if the listing is inactive/expired, or
        if attempting to offer on one's own listing.
      security:
        - bearerAuth: []
      parameters:
        - name: listing
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketplaceOfferCreateRequest'
      responses:
        "201":
          description: Offer submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    $ref: '#/components/schemas/MarketplaceOffer'
        "422":
          description: Own listing, inactive listing, or an existing pending offer

  /marketplace/{listing}/offers/{offer}/accept:
    patch:
      tags: [Marketplace]
      summary: Accept an offer — executes the trade immediately (seller, PIN required)
      description: >
        Requires the seller's transaction PIN. Trade execution (unit
        transfer, payment, and settlement) is delegated to
        MarketplaceTradeService and completes synchronously.
      security:
        - bearerAuth: []
      parameters:
        - name: listing
          in: path
          required: true
          schema: { type: integer }
        - name: offer
          in: path
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketplaceAcceptOfferRequest'
      responses:
        "200":
          description: Trade complete — units transferred immediately
        "422":
          description: Offer no longer pending, or incorrect PIN

  /marketplace/{listing}/offers/{offer}/reject:
    patch:
      tags: [Marketplace]
      summary: Reject a pending offer (seller only)
      security:
        - bearerAuth: []
      parameters:
        - name: listing
          in: path
          required: true
          schema: { type: integer }
        - name: offer
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Offer rejected
        "422":
          description: Offer is not pending

  /marketplace/{listing}/offers/{offer}/withdraw:
    patch:
      tags: [Marketplace]
      summary: Withdraw a pending offer (buyer only)
      security:
        - bearerAuth: []
      parameters:
        - name: listing
          in: path
          required: true
          schema: { type: integer }
        - name: offer
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Offer withdrawn
        "403":
          description: Not the offer's buyer
        "422":
          description: Offer cannot be withdrawn

  /marketplace/{listing}/messages:
    get:
      tags: [Marketplace]
      summary: Read the message thread for a listing
      description: >
        Sellers must supply `with` (the buyer's user ID) to select which
        buyer thread to view, since a seller may have several concurrent
        conversations on one listing. Buyers need no parameter — their
        thread is always with the seller. Marks the other party's
        messages as read.
      security:
        - bearerAuth: []
      parameters:
        - name: listing
          in: path
          required: true
          schema: { type: integer }
        - name: with
          in: query
          schema: { type: integer }
          description: Required for the seller; ignored for buyers
      responses:
        "200":
          description: Message thread, oldest first
        "403":
          description: Not a participant in this listing's conversation, or invalid `with`
    post:
      tags: [Marketplace]
      summary: Send a message on a listing's thread
      description: >
        A seller must supply `receiver_id` (the buyer being messaged); a
        buyer's message always routes to the seller automatically.
      security:
        - bearerAuth: []
      parameters:
        - name: listing
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketplaceMessageCreateRequest'
      responses:
        "201":
          description: Message sent
        "403":
          description: Not a participant in this listing's conversation
        "422":
          description: Seller sent without receiver_id

