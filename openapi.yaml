      summary: List flagged/blocked screenings pending manual review
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Paginated unreviewed screenings

  /admin/compliance/screenings/{screening}:
    get:
      tags: [Admin – Compliance]
      summary: View a screening's full match details
      security:
        - bearerAuth: []
      parameters:
