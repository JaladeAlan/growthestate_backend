      responses:
        "200":
          description: Own active certificates
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Certificate'

  /certificates/{certNumber}:
    get:
      tags: [Certificates]
      summary: View a single owned certificate
      security:
        - bearerAuth: []
      parameters:
        - name: certNumber
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Certificate detail
        "404":
          description: Not found or not owned by this user

  /certificates/{certNumber}/download:
    get:
      tags: [Certificates]
      summary: Download the certificate as a PDF
      description: Only active (non-revoked) certificates can be downloaded.
      security:
        - bearerAuth: []
      parameters:
        - name: certNumber
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PDF file stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          description: Certificate is revoked
        "404":
          description: Not found or not owned by this user

  /verify/{verifyToken}:
    get:
      tags: [Certificates]
      summary: Publicly verify a certificate by verification token (e.g. via QR code scan)
      description: >
        No authentication required. Result is cached for 60 seconds to
        absorb QR-scan bursts. Returns only non-sensitive fields suitable
        for public display. Uses an opaque verification token rather than
        the sequential certificate number, by design, to prevent
        enumeration of certificates.
      security: []
      parameters:
        - name: verifyToken
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateVerifyResponse'
        "404":
          description: Certificate not found or signature invalid

