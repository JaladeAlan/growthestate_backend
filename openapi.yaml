      summary: List all posts regardless of status (drafts + published)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, published] }
        - name: per_page
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Paginated posts
    post:
      tags: [Admin – Blog]
      summary: Create a new blog post (draft by default)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BlogPostCreateRequest'
      responses:
        "201":
          description: Post created

  /admin/blog/{blogPost}:
    get:
      tags: [Admin – Blog]
      summary: View a single post (any status) for editing
      security:
        - bearerAuth: []
      parameters:
        - name: blogPost
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Post detail
    put:
      tags: [Admin – Blog]
      summary: Update an existing post
      description: >
        Setting status to `published` for the first time stamps
        published_at (defaulting to now); reverting to `draft` clears it.
      security:
        - bearerAuth: []
      parameters:
        - name: blogPost
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          multipart/form-data:
