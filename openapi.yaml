      parameters:
        - name: blogCategory
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogCategoryRequest'
      responses:
        "200":
          description: Category updated
    delete:
      tags: [Admin – Blog]
      summary: Delete a category (posts in it are set to no category, not deleted)
      security:
        - bearerAuth: []
      parameters:
        - name: blogCategory
          in: path
          required: true
          schema: { type: integer }
      responses:
