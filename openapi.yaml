  ################################################################
  # ADMIN — WITHDRAWALS
  ################################################################

  /admin/withdrawals:
    get:
      tags: [Admin – Withdrawals]
      summary: List withdrawals (filterable by status), pending-first ordering
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, processing, completed, rejected, failed]
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Paginated withdrawal list

  /admin/withdrawals/approve-all:
    post:
      tags: [Admin – Withdrawals]
      summary: Batch-approve all pending withdrawals
      description: >
        Each withdrawal is moved pending → processing and committed in
        its own transaction *before* the Paystack transfer call, and any
        transfer failure is recorded in a separate transaction scoped by
        `WHERE status = 'processing'`. This prevents a failed transfer
        from rolling back the status change of a withdrawal that Paystack
        may have already received — see the note on
        `/admin/withdrawals/{id}/approve` for the full rationale. Skips
        (does not error on) any withdrawal whose status changed to
        something other than `pending` between the initial query and the
        row lock.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Batch result with per-withdrawal outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  approved: { type: integer }
                  failed: { type: integer }
                  details:
                    type: object
                    properties:
                      approved:
                        type: array
                        items: { type: string }
                        description: References of successfully approved withdrawals
                      failed:
                        type: array
                        items:
                          type: object
                          properties:
                            reference: { type: string }
                            error: { type: string }

  /admin/withdrawals/{id}/approve:
    post:
      tags: [Admin – Withdrawals]
      summary: Approve a single pending withdrawal and initiate the Paystack transfer
      description: >
        Only `pending` withdrawals can be approved. The status change to
        `processing` is committed before the Paystack API call; if the
        call throws, the withdrawal is marked `failed` in a separate
        transaction rather than rolled back to `pending` — this avoids a
        possible double-transfer if Paystack had actually received the
        transfer before the exception surfaced. A `failed` withdrawal is
        NOT auto-refunded; an admin must verify the transfer status on
        the Paystack dashboard before rejecting it.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Approved and transfer initiated
        "422":
          description: Withdrawal is not pending
        "502":
          description: Transfer initiation failed — withdrawal marked failed, verify on Paystack

  /admin/withdrawals/{id}/reject:
    post:
      tags: [Admin – Withdrawals]
      summary: Reject a pending or failed withdrawal and refund the user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Rejected and funds returned to the user's wallet
        "422":
          description: Only pending or failed withdrawals can be rejected

