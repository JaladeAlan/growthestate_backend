              $ref: '#/components/schemas/BlogPostUpdateRequest'
      responses:
        "200":
          description: Post updated
    delete:
      tags: [Admin – Blog]
      summary: Delete a post (also removes its cover image from storage)
      security:
        - bearerAuth: []
      parameters:
        - name: blogPost
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Post deleted

  /admin/blog/categories:
    get:
