name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Pint (dry run — fails on unformatted code)
        run: ./vendor/bin/pint --test

  test:
    name: Tests (PHPUnit/Pest)
    runs-on: ubuntu-latest

    # The app uses Postgres-specific SQL (raw ON CONFLICT upserts in
    # PurchaseController, PostGIS-backed land geometry) — CI runs against
    # real Postgres rather than sqlite so those code paths are actually
    # exercised, matching production.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: growthestate_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, pdo_pgsql, redis
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Point env at CI services
        run: |
          php artisan config:clear
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
          {
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=5432"
            echo "DB_DATABASE=growthestate_test"
            echo "DB_USERNAME=postgres"
            echo "DB_PASSWORD=postgres"
            echo "REDIS_HOST=127.0.0.1"
            echo "REDIS_PORT=6379"
            echo "QUEUE_CONNECTION=sync"
            echo "CACHE_STORE=redis"
          } >> .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test --parallel

  static-analysis:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-latest
    # Non-blocking until the codebase has a baseline committed — flip
    # continue-on-error to false once `phpstan analyse --generate-baseline`
    # has been run and the baseline file is checked in.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install PHPStan (Larastan)
        run: composer require --dev larastan/larastan:^2.0 --no-interaction

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=1G