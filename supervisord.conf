[supervisord]
nodaemon=true
user=www-data
logfile=/var/www/html/storage/logs/supervisord.log
pidfile=/tmp/supervisord.pid

[program:laravel-server]
command=php artisan serve --host=0.0.0.0 --port=%(ENV_PORT)s
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/var/www/html/storage/logs/server.out.log
stderr_logfile=/var/www/html/storage/logs/server.err.log

[program:laravel-queue]
command=php artisan queue:work redis --queue=emails,default --sleep=3 --tries=3 --timeout=90
directory=/var/www/html
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/www/html/storage/logs/queue.out.log
stderr_logfile=/var/www/html/storage/logs/queue.err.log