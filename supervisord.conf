[supervisord]
nodaemon=true
user=www-data
logfile=/var/www/html/storage/logs/supervisord.log
pidfile=/tmp/supervisord.pid

[program:laravel-fpm]
; php-fpm's own pool (www.conf) listens on 9000 already — this just keeps
; it in the foreground under supervisord instead of `artisan serve`, which
; was intercepting OPTIONS preflight requests before Laravel ever saw them.
command=php-fpm -F
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/var/www/html/storage/logs/server.out.log
stderr_logfile=/var/www/html/storage/logs/server.err.log

[program:laravel-worker]
; Consumes queued jobs (ScreenUserJob, GenerateDailyPortfolioSnapshot, etc.)
; on the "default" queue. Without this, ShouldQueue jobs are dispatched but
; never processed — they just accumulate in Redis indefinitely.
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/www/html/storage/logs/worker.out.log
stderr_logfile=/var/www/html/storage/logs/worker.err.log