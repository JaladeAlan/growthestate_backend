[supervisord]
nodaemon=true
user=root
logfile=/var/www/html/storage/logs/supervisord.log
pidfile=/tmp/supervisord.pid

[program:laravel-fpm]
command=php-fpm -F
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/var/www/html/storage/logs/fpm.out.log
stderr_logfile=/var/www/html/storage/logs/fpm.err.log

[program:laravel-worker]
command=php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --timeout=120 --memory=128 --max-jobs=100 --max-time=3600
directory=/var/www/html
user=root
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/www/html/storage/logs/worker.out.log
stderr_logfile=/var/www/html/storage/logs/worker.err.log

[program:nginx]
; started only after entrypoint.sh has rendered /etc/nginx/conf.d/default.conf
; from the template with the real $PORT substituted in.
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/www/html/storage/logs/nginx.out.log
stderr_logfile=/var/www/html/storage/logs/nginx.err.log